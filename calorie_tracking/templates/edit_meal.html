{% extends "base.html" %}

{% block content %}
<table class="table table-striped">
    <thead>
        <tr>
            <th>Food</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for meal_item in meal_items %}
        <tr>
            <td>{{ meal_item.custom_item.food }}</td>
            <td>{{ meal_item.quantity }}</td>
            <td>
                <form action="{{ url_for('delete_meal_item', meal_id=meal.id, item_id=meal_item.custom_item.id) }}" method="POST">
                    <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{%  endblock %}
