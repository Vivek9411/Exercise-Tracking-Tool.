<h2>{{ meal.name }}</h2>
<p>Total Calories: {{ meal.total_calories }}</p>
<p>Protein: {{ meal.total_protein }}g</p>

<h3>Items in Meal:</h3>
<ul>
    {% for item, qty in meal_items %}
        <li>{{ item }} - {{ qty }} units</li>
    {% endfor %}
</ul>

<a href="{{ url_for('edit_meal', meal_id=meal.id) }}">Edit Meal</a>
<form action="{{ url_for('delete_meal', meal_id=meal.id) }}" method="POST">
    <button type="submit" onclick="return confirm('Are you sure?')">Delete Meal</button>
</form>
